name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: lint, types, imports, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The geospatial and meteorological stack links against these. eccodes
      # in particular ships no wheel, and cfgrib will not import without it.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libeccodes0 libgdal-dev libproj-dev libgeos-dev libhdf5-dev

      # CPU wheels: the CUDA build is roughly 2 GB larger and CI has no GPU.
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src scripts tests

      - name: Format
        run: ruff format --check src scripts tests

      - name: Types
        run: mypy

      # Catches syntax errors, circular imports and missing dependencies, and
      # loads all five configs through the cross-file validator. Needs no
      # weights, no corpus and no GPU.
      - name: Imports and configuration
        run: python scripts/verify_imports.py

      - name: Tests
        run: pytest

  docker:
    name: image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build only. Running the image would need the checkpoints, the
      # climatology and the NDMA collection, none of which live in this
      # repository.
      - name: Build
        run: docker build -t indra:ci .
