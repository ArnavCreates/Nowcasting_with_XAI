name: Continuous training

# Monthly through the monsoon, and on demand. Retraining on a cadence shorter
# than the archive updates spends GPU hours to reproduce the same weights.
on:
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      max_steps:
        description: Steps for this cycle
        default: "20000"
      apply:
        description: Promote the candidate if it clears the gate
        type: boolean
        default: false

# One cycle at a time. Two concurrent runs would race to write the same
# checkpoint and the same metrics file.
concurrency:
  group: continuous-training
  cancel-in-progress: false

jobs:
  cycle:
    name: fetch, train, evaluate, gate
    runs-on: ubuntu-latest
    # A cycle is hours of GPU work on a real runner. The default timeout would
    # kill it partway and leave a half-written checkpoint behind.
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libeccodes0 libgdal-dev libproj-dev libgeos-dev libhdf5-dev

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The window cache is the expensive part of a cycle: rebuilding a target
      # window costs twelve HEM granules plus twelve INSAT granules for the
      # cloud-top temperatures parallax needs.
      - name: Restore window cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: windows-${{ hashFiles('configs/data/*.yaml') }}
          restore-keys: windows-

      - name: Fetch artefacts
        env:
          INDRA_DATA_BASE_URL: ${{ vars.INDRA_DATA_BASE_URL }}
          INDRA_WEIGHTS_BASE_URL: ${{ vars.INDRA_WEIGHTS_BASE_URL }}
        run: |
          bash scripts/fetch_data.sh
          bash scripts/fetch_weights.sh

      - name: Train
        run: |
          python scripts/train.py \
            --max-steps "${{ github.event.inputs.max_steps || 20000 }}"

      # Scored on JJAS 2020, which no training window reaches into: the split
      # is tested at each window's reaching edge, not at its t0.
      - name: Evaluate candidate
        run: |
          python scripts/evaluate.py \
            --checkpoint checkpoints/indra_fusion_v1_best.pt \
            --out metrics/candidate.json

      # Exit 1 on rejection, so the step fails visibly rather than logging a
      # decision nobody reads. --apply only on an explicit dispatch.
      - name: Gate
        id: gate
        run: |
          python scripts/ct_promote.py \
            --candidate metrics/candidate.json \
            --incumbent metrics/production.json \
            ${{ github.event.inputs.apply == 'true' && '--apply' || '' }}

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ct-metrics-${{ github.run_number }}
          path: |
            metrics/candidate.json
            metrics/gate.json
          if-no-files-found: ignore
